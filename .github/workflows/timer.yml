name: 다음 수집 시계

# GitHub 의 정각 실행(schedule)은 바쁘면 늦거나 아예 빠진다. GitHub 문서도 "부하가 크면 일부가 빠질 수 있다"고 한다.
# 이 저장소에서는 2026-10-13 06시~16시에 정각 실행이 한 번만 돌았다.
# 그래서 '매물 모으기'가 끝날 때마다 이 시계를 다시 맞춘다: 정한 시각(due)까지 기다렸다가 '매물 모으기'를 부른다.
#  - 새 시계를 맞추면 기다리던 시계는 취소된다(concurrency) → 시계는 늘 하나뿐이다.
#  - GITHUB_TOKEN 으로 부른 workflow_dispatch 는 새 실행을 만든다(GitHub 문서: workflow_dispatch·repository_dispatch 는 예외).
#  - 공개 저장소라 기다리는 동안의 실행 시간도 요금이 들지 않는다.
#  - 시계가 끊기면 정각 실행(collect.yml 의 schedule)이나 페이지 요청·폰 앱 알림으로 '매물 모으기'가 한 번 돌 때 다시 맞춰진다.
on:
  workflow_dispatch:
    inputs:
      due:
        description: '매물 모으기를 부를 시각 (유닉스 초). 비우면 한 시간 뒤'
        required: false
        default: ''

concurrency:
  group: timer
  cancel-in-progress: true

permissions:
  actions: write

jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 정한 시각까지 기다렸다가 매물 모으기 부르기
        env:
          GH_TOKEN: ${{ github.token }}
          DUE: ${{ inputs.due }}
        run: |
          now=$(date +%s)
          due="$DUE"
          case "$due" in ''|*[!0-9]*) due=$((now + 3600)) ;; esac
          # 이상한 값이 와도 1분 ~ 80분 안으로
          if [ "$due" -lt $((now + 60)) ]; then due=$((now + 60)); fi
          if [ "$due" -gt $((now + 4800)) ]; then due=$((now + 4800)); fi
          echo "매물 모으기 부를 시각: $(TZ=Asia/Seoul date -d "@$due" '+%m/%d %H:%M:%S') (한국 시각)"
          sleep $((due - $(date +%s)))
          gh workflow run collect.yml -R "$GITHUB_REPOSITORY" --ref main
          echo "매물 모으기를 불렀어요"
