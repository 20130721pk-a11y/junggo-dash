name: 시험

on:
  push:
    branches: [ main ]
    paths: [ 'collector/**', 'box.js', 'radar-view.js', 'index.html', 'test/**', '.github/workflows/test.yml' ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test collector/test/*.test.mjs
      - run: node --test test/*.test.mjs
