<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src https: data:; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>꿀매 레이더</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M24 24 L24 4 A20 20 0 0 1 41.32 14 Z' fill='%23A98BF7' fill-opacity='0.28'/%3E%3Ccircle cx='24' cy='24' r='20' fill='none' stroke='%23A98BF7' stroke-width='2.4'/%3E%3Ccircle cx='24' cy='24' r='10.5' fill='none' stroke='%23A98BF7' stroke-width='2.4' stroke-opacity='0.55'/%3E%3Cline x1='24' y1='24' x2='41.32' y2='14' stroke='%23A98BF7' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='24' cy='24' r='2.6' fill='%23A98BF7'/%3E%3Cg transform='translate(31.4 12.6) scale(0.62)'%3E%3Cpath d='M0,-9 C3.6,-4.6 6,-1.9 6,1.4 A6,6 0 0 1 -6,1.4 C-6,-1.9 -3.6,-4.6 0,-9Z' fill='%23FFC24B'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 웹 2판 — 디자인 시안 web2-mock.html 의 토큰·모양 그대로(앱 ui/theme/Color.kt 와 같은 값). 시안 조작판만 뺐어요 */
/* ===== 토큰 — 디자인 v2 tokens.json(앱 docs/design/v2) 값 ===== */
:root {
  --bg: #0D0E13; --surface: #16171E; --surface2: #1C1E27; --line: #23252F;
  --ink: #F2F3F6; --ink2: #A6ACBA; --ink3: #858C9C;
  --line-strong: #626A78; /* v2: 입력칸·보조 단추·꺼진 스위치 테두리·시세 눈금(3:1) */
  --brand: #7A4BEA; --on-brand: #FFFFFF; --brand-bright: #A98BF7; --brand-soft: #241F3A;
  --honey: #FFC24B; --honey-soft: rgba(255,194,75,.14); --honey-edge: rgba(255,194,75,.5); --on-honey: #3A2800;
  --mint: #2BD4A0;
  --coral: #F2766A; --coral-soft: rgba(242,118,106,.15);
  --fair-fg: #9AA1AD; --fair-soft: rgba(150,154,168,.14);
  --mk-j: #22B07D; --mk-d: #F5812F; --mk-b: #4D8DF0;
  --font: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  /* 글자 12단계(tokens.json type — 줄높이·굵기는 쓰는 곳에서). html.big(125%)이면 같이 커져요 */
  --fs-display: 1.625rem; --fs-price-lg: 1.375rem; --fs-price: 1.25rem; --fs-price-sm: 1rem;
  --fs-headline: 1.375rem; --fs-title: 1.125rem; --fs-body-lg: .9375rem; --fs-body: .875rem; --fs-body-sm: .8125rem;
  --fs-label: .75rem; --fs-meta: .6875rem; /* 가장 작은 읽는 글 11px */ --fs-mark: .625rem; /* 중·당·번 네모 안 글자 하나만 */
  /* 간격 4 단위 */
  --s0: 2px; --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px;
  /* 모서리 6개(v2): 배지 6 · 작은 것 8 · 입력·띠·썸네일 12 · 카드 16 · 시트·창 20 · 알약 999 */
  --r-badge: 6px; --r-ctl: 8px; --r-box: 12px; --r-field: var(--r-box); --r-thumb: var(--r-box); --r-search: var(--r-box); --r-card: 16px; --r-dialog: 20px; --r-pill: 999px;
  --scrim: rgba(0,0,0,.6);
  color-scheme: dark;
}
html { font-size: 100%; }
html.big { font-size: 125%; }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: var(--fs-body); line-height: 1.5;
  word-break: keep-all; overflow-wrap: anywhere;
}
button, input, select { font: inherit; color: inherit; }
a { color: var(--brand-bright); }
:focus-visible { outline: 2px solid var(--brand-bright); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.ico { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
.ico.fill { fill: currentColor; stroke: none; }

/* ===== 머리 ===== */
.top {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 24px;
  height: 56px; padding: 0 24px; background: var(--bg); border-bottom: 1px solid var(--line);
}
.brand { display: inline-flex; align-items: center; gap: 12px; font-size: var(--fs-title); font-weight: 700; color: var(--ink); text-decoration: none; flex: none; }
.tabs { display: flex; gap: 4px; height: 100%; }
.tab {
  display: inline-flex; align-items: center; gap: 8px; height: 100%; padding: 0 12px;
  border: 0; border-bottom: 2px solid transparent; background: none; color: var(--ink2);
  font-size: var(--fs-body); font-weight: 600; cursor: pointer;
}
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--brand-bright); }
.tab .ico { display: none; }
.live { margin-left: auto; display: flex; align-items: center; gap: 12px; min-width: 0; }
.live-text { display: inline-flex; align-items: center; gap: 8px; color: var(--ink2); font-size: var(--fs-body-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--mint); }
.dot.gray { background: var(--ink3); }
.dot.coral { background: var(--coral); }
.live-short { display: none; }

/* 단추 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 16px;
  border: 1px solid var(--line-strong); border-radius: var(--r-ctl); background: var(--surface); color: var(--ink);
  font-size: var(--fs-body-sm); font-weight: 600; white-space: nowrap; cursor: pointer; text-decoration: none;
}
.btn:hover { background: var(--surface2); }
.btn-fill { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.btn-fill:hover { background: #6a3fd6; }
.btn-text { border-color: transparent; background: none; color: var(--brand-bright); padding: 0 8px; }
.btn-text:hover { background: var(--brand-soft); }
.btn-sm { height: 32px; padding: 0 12px; font-size: var(--fs-label); }

/* ===== 띠 ===== */
.banners { display: grid; gap: 8px; max-width: 1280px; margin: 0 auto; padding: 12px 24px 0; }
.banners:empty { display: none; }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: var(--r-box); background: var(--coral-soft); }
.banner .ico { color: var(--coral); margin-top: 2px; }
.banner b { display: block; color: var(--coral); font-weight: 700; font-size: var(--fs-body); }
.banner span { display: block; color: var(--ink2); font-size: var(--fs-body-sm); margin-top: 2px; }
.banner .btn { margin-left: auto; flex: none; }

/* ===== 본문 ===== */
.page { max-width: 1280px; margin: 0 auto; padding: 20px 24px 64px; }
.sec-title { margin: 0; font-size: var(--fs-title); font-weight: 700; }
.sec-sub { margin: 4px 0 0; color: var(--ink3); font-size: var(--fs-body-sm); }
.muted { color: var(--ink3); }
.ink2 { color: var(--ink2); }
.meta { color: var(--ink3); font-size: var(--fs-body-sm); }

/* 첫 화면 */
.home { display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 24px; align-items: start; }
.home-head { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 12px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
.card {
  display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card);
}
.card.has-honey { border-color: var(--honey-edge); }
.card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card-head .when { margin-left: auto; color: var(--ink3); font-size: var(--fs-label); }
.chip-name { padding: 2px 8px; border-radius: var(--r-pill); background: var(--brand-soft); color: var(--brand-bright); font-size: var(--fs-label); font-weight: 600; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--r-pill); background: var(--surface2); color: var(--ink2); font-size: var(--fs-label); font-weight: 600; white-space: nowrap; }
.pill.honey { background: var(--honey-soft); color: var(--honey); }
.pill.focus { background: var(--brand-soft); color: var(--brand-bright); }
.pill .ico { width: 12px; height: 12px; vertical-align: -2px; }
.low { display: grid; grid-template-columns: 56px minmax(0,1fr); gap: 12px; align-items: center; padding: 4px 0; border-radius: var(--r-box); text-decoration: none; color: inherit; cursor: pointer; }
.low:hover .ltitle { text-decoration: underline; text-underline-offset: 3px; }
.ltitle { margin: 0; font-size: var(--fs-body); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.price-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
.price { font-size: var(--fs-price); font-weight: 700; line-height: 26px; font-variant-numeric: tabular-nums; }
.facts { margin: 0; color: var(--ink3); font-size: var(--fs-body-sm); }
.fact-hi { color: var(--ink); font-weight: 600; } /* signals: N일 만에 최저·목표가 이하 = ink 굵게(꿀골드 아님) */
.facts .fact-hi .ico { margin-right: 4px; } .fact-hi .ico.t { color: var(--brand-bright); }
.lines { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.mlow { display: inline-flex; align-items: center; gap: 4px; color: var(--ink2); font-size: var(--fs-body-sm); font-weight: 600; }
.note { display: flex; gap: 8px; align-items: flex-start; margin: 0; color: var(--ink2); font-size: var(--fs-body-sm); }
.note .ico { margin-top: 1px; }
.note.link { cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; background: none; border: 0; padding: 0; text-align: left; }
.note.brand { color: var(--brand-bright); }
.card svg[role="img"] { display: block; width: 100%; height: 28px; }
.card-foot { display: flex; justify-content: flex-end; border-top: 1px solid var(--line); margin-top: 4px; padding-top: 4px; }
.state-text { margin: 8px 0 2px; font-size: var(--fs-body); }

/* 사진 + 마켓 표시 */
.thumb { position: relative; width: 56px; height: 56px; border-radius: var(--r-thumb); background: var(--surface2); }
.thumb.lg { width: 64px; height: 64px; } /* thumb-md: 지금 최저가 */
.thumb.sm { width: 56px; height: 56px; } /* thumb-sm: 관심 매물 */
.row > .thumb.sm { width: 64px; height: 64px; } /* thumb-md: 결과 목록 줄 */
.sheet-head .thumb.lg { width: 72px; height: 72px; } /* thumb-lg: 판단 창 */
.thumb .mk { position: absolute; left: -5px; bottom: -5px; box-shadow: 0 0 0 2px var(--surface); }
.thumb::after { content: ""; position: absolute; inset: 30% 26%; border: 1.5px solid #2a2d38; border-radius: 4px; }
.mk {
  display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 4px; flex: none;
  color: var(--bg); font-size: var(--fs-mark); font-weight: 700; line-height: 1;
} /* v2 market-mark 16 · mark 10/700 */
.mk.sm { width: 16px; height: 16px; border-radius: 4px; font-size: var(--fs-mark); }
.thumb .mk { width: 20px; height: 20px; border-radius: var(--r-badge); } /* market-badge 20 */
.mk-j { background: var(--mk-j); } .mk-d { background: var(--mk-d); } .mk-b { background: var(--mk-b); }

/* 등급 배지 */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: var(--r-badge); font-size: var(--fs-label); font-weight: 600; line-height: 16px; white-space: nowrap; }
.badge .ico { width: 12px; height: 12px; vertical-align: -2px; } /* honey 12 on-honey */
.b-honey { background: var(--honey); color: var(--on-honey); }
.b-good { background: var(--brand-soft); color: var(--brand-bright); }
.b-fair { background: var(--fair-soft); color: var(--fair-fg); }
.b-high { background: var(--coral-soft); color: var(--coral); }
.b-caution { background: var(--surface2); color: var(--ink2); }
.b-scam { background: var(--surface2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong); } /* 0.8.2 사기 의심: 회색 안에서 한 단 진하게(코랄 아님), 테두리는 안쪽이라 크기 같음 */
/* 0.8.2 ⚠ 배지 단추(사유 있음) — 보이는 크기 그대로, 누름 칸만 위아래로 늘려 44(좁은 폭 48) */
button.bwhy { position: relative; margin: 0; border: 0; font: inherit; font-size: var(--fs-label); font-weight: 600; line-height: 16px; cursor: pointer; }
button.bwhy::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 44px; transform: translateY(-50%); }
button.bwhy:hover { background: var(--line); }
.b-plain { background: var(--surface2); color: var(--ink2); font-weight: 600; }
.then { color: var(--ink3); font-size: var(--fs-label); }
.chg { padding: 4px 8px; border-radius: var(--r-badge); background: var(--surface2); color: var(--ink); font-size: var(--fs-label); font-weight: 600; line-height: 16px; }
.chg.up { color: var(--ink3); }

/* 오래됨 */
.stale-day { --ink: #A6ACBA; --ink2: #858C9C; }
.stale-day .b-honey { background: transparent; color: var(--honey); box-shadow: inset 0 0 0 1.5px var(--honey); }
.sold-maybe { color: var(--ink3); font-size: var(--fs-label); }

/* 새 꿀매 */
.feed { display: grid; gap: 8px; }
.feed-row { display: grid; grid-template-columns: 56px minmax(0,1fr); gap: 12px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); cursor: pointer; }
.feed-row.fresh { border-color: var(--honey-edge); }
.feed-row .top-line { display: flex; align-items: center; gap: 8px; }
.feed-row .top-line .meta { margin-left: auto; font-size: var(--fs-label); }

/* 물건 화면 */
.pv { display: grid; grid-template-columns: 240px minmax(0,1fr); gap: 24px; align-items: start; }
.plist { position: sticky; top: 76px; display: grid; gap: 2px; }
.plist button {
  display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 2px 8px; align-items: center; width: 100%;
  padding: 12px 12px; border: 1px solid transparent; border-radius: var(--r-ctl); background: none; text-align: left; cursor: pointer;
}
.plist button:hover { background: var(--surface2); }
.plist button[aria-current="true"] { background: var(--surface); border-color: var(--line); }
.plist .pn { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plist .ps { color: var(--ink2); font-size: var(--fs-label); font-variant-numeric: tabular-nums; }
.plist .ph { grid-column: 2; grid-row: 1 / span 2; }
.plist .pm { color: var(--ink3); font-size: var(--fs-label); }
.pv-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.pv-head h1 { margin: 0; font-size: var(--fs-headline); font-weight: 700; line-height: 1.3; }
.conds { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; padding: 0; list-style: none; }
.conds li { padding: 2px 12px; border: 1px solid var(--line); border-radius: var(--r-pill); color: var(--ink2); font-size: var(--fs-label); }
.app-only { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; color: var(--ink3); font-size: var(--fs-body-sm); }
.grid2 { display: grid; grid-template-columns: minmax(0,1.25fr) minmax(0,1fr); gap: 16px; margin-top: 16px; }
.box { padding: 16px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); min-width: 0; }
.box-label { margin: 0 0 8px; color: var(--brand-bright); font-size: var(--fs-label); font-weight: 600; }
.box-label.plain { color: var(--ink2); }
.hero { display: grid; grid-template-columns: 64px minmax(0,1fr); gap: 16px; }
.hero .ltitle { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: var(--fs-body-lg); font-weight: 600; }
.hero .price { font-size: var(--fs-price-lg); line-height: 28px; } /* price-lg 22/28 */

.hero-bottom { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.hero-bottom .btn { margin-left: auto; }
.vcut { display: grid; grid-template-columns: 78px minmax(0,1fr); gap: 8px; padding: 4px 0; font-size: var(--fs-body-sm); }
.vcut b { font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vcut span { color: var(--ink2); }
.ref-big { margin: 0; font-size: var(--fs-body-lg); font-weight: 600; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; margin-top: 12px; }
.grid3.two { grid-template-columns: repeat(2, minmax(0,1fr)); }
.trend { margin-top: 12px; }
.trend svg { display: block; width: 100%; height: 120px; }
.ledger { display: grid; gap: 4px; margin: 12px 2px 0; }

/* 매물 목록 */
.list-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-top: 24px; padding: 12px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-box); }
.mkt { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--r-pill); background: var(--surface); color: var(--ink); font-size: var(--fs-body-sm); cursor: pointer; }
.mkt[aria-pressed="false"] { color: var(--ink3); }
.mkt[aria-pressed="false"] .mk { background: transparent !important; box-shadow: inset 0 0 0 1.5px currentColor; }
.mkt[aria-pressed="false"] .mk-j { color: var(--mk-j); } .mkt[aria-pressed="false"] .mk-d { color: var(--mk-d); } .mkt[aria-pressed="false"] .mk-b { color: var(--mk-b); }
.mkt b { font-weight: 600; font-variant-numeric: tabular-nums; }
/* 변형 칩 — 앱 ChoiceChip(Common.kt:231): 고르지 않음 Surface2·Ink2, 고름 Brand·흰 글 */
.vchips { display: inline-flex; flex-wrap: wrap; gap: 8px; }
.vchip { height: 36px; padding: 0 12px; border: 0; border-radius: var(--r-pill); background: var(--surface2); color: var(--ink2); font: inherit; font-size: var(--fs-body-sm); font-weight: 600; cursor: pointer; }
.vchip[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); }
.sel { display: inline-flex; align-items: center; gap: 8px; color: var(--ink2); font-size: var(--fs-body-sm); }
.sel select, .find { height: 32px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--r-ctl); background: var(--bg); color: var(--ink); }
.find { width: 180px; }
.chk { display: inline-flex; align-items: center; gap: 8px; color: var(--ink2); font-size: var(--fs-body-sm); cursor: pointer; }
.chk input { width: 16px; height: 16px; margin: 0; accent-color: var(--brand); }
.tools-right { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.list-sum { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin: 12px 2px 8px; color: var(--ink2); font-size: var(--fs-body-sm); }
.list-sum .btn-text { height: 28px; }
.rows { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
.row {
  display: grid; grid-template-columns: 64px minmax(0,1fr) 116px 120px 104px 150px 76px 20px;
  gap: 12px; align-items: center; min-height: 64px; padding: 8px 4px; border-bottom: 1px solid var(--line);
  text-decoration: none; color: inherit; cursor: pointer;
}
.row:hover { background: var(--surface); }
.row.flash { box-shadow: inset 0 0 0 1.5px var(--brand-bright); }

/* 알림함 */

/* 수집 상태 */

/* 잠금·특수 */
.center { max-width: 460px; margin: 64px auto; padding: 24px 24px 24px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); }

/* ===== 폭 ===== */

}

    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; height: 60px; gap: 0;

  }

  .row { grid-template-columns: 64px minmax(0,1fr); grid-template-areas: "th main"; align-items: start; }
  .row > .thumb { grid-area: th; }
  .row > .rmain { grid-area: main; }
  .row > .rb, .row > .rp, .row > .rm, .row > .rw, .row > .rn, .row > .rx { display: none; }
  .row .compact { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 4px; }
  .row .compact .rp2 { font-weight: 700; font-size: var(--fs-price-sm); font-variant-numeric: tabular-nums; }
  .row .rt { white-space: normal; }

  .hero { grid-template-columns: 64px minmax(0,1fr); }
  .gap-row { grid-template-columns: minmax(0,1fr); }

}
@media (prefers-reduced-motion: reduce) { .row.flash { box-shadow: none; } }

/* ===== 웹 2판에서 더한 것 (시안 CSS 는 위에 그대로) ===== */

.tab .cnt { min-width: 18px; padding: 0 4px; border-radius: 999px; background: var(--brand); color: var(--on-brand); font-size: var(--fs-meta); line-height: 18px; text-align: center; }

.cmdpill .ico { width: 12px; height: 12px; }
.cmdpill.run { background: var(--brand-soft); color: var(--brand-bright); }
.cmdpill.bad { background: var(--coral-soft); color: var(--coral); }

.grow { flex: 1; }

/* 검색창 + 최근 */

.rchip .x { display: inline-grid; place-items: center; width: 22px; height: 22px; border: 0; border-radius: 50%; background: none; color: var(--ink3); cursor: pointer; opacity: 0; }

.rchip:hover .x, .rchip:focus-within .x { opacity: 1; }

.home { margin-top: 20px; }
.home-head { flex-wrap: wrap; gap: 8px; }

.card { min-width: 0; }

/* 명령 처리 상태: 그 자리 한 줄 */

/* 그냥 검색 진행 칸 */
.steps { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; padding: 16px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); }

.step .n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid currentColor; font-size: var(--fs-meta); font-weight: 700; flex: none; }

/* 결과 화면 */
.pv.solo { grid-template-columns: minmax(0,1fr); }
.pv-head .acts { margin-left: auto; display: flex; gap: 8px; }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--ink2); background: none; border: 0; cursor: pointer; padding: 0 4px; font-size: var(--fs-body-sm); }
.subtabs { display: flex; gap: 4px; margin: 12px 0 12px; border-bottom: 1px solid var(--line); }

.subtabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brand-bright); }
.chiprow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.chiprow .gap { width: 6px; }
.mchip { display: inline-flex; align-items: center; gap: 4px; height: 36px; padding: 0 12px 0 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink2); font-size: var(--fs-label); font-weight: 600; cursor: pointer; }
.mchip.all { padding: 0 16px; }
.mchip[aria-checked="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); } /* 11/1 결정 3: 고르면 보라 하나 — 마켓색은 중·당·번 표시 안에만 */
.mchip[aria-checked="true"] .mk { box-shadow: 0 0 0 1.5px var(--on-brand); }
.cchip { display: inline-flex; align-items: center; gap: 4px; height: 36px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--surface2); color: var(--ink2); font-size: var(--fs-label); font-weight: 600; cursor: pointer; white-space: nowrap; }
.cchip[aria-checked="true"], .cchip[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); }
.cchip[disabled] { cursor: not-allowed; opacity: .55; }
.cchip.ex { background: var(--coral-soft); color: var(--coral); text-decoration: line-through; }
.cchip.in { background: var(--brand); color: var(--on-brand); }
.cchip .c { color: var(--ink2); font-weight: 400; } /* 건수: 디자인 확정 10/25(text-r12-r8 3-2) — Ink3(4.46:1)·흰 75%(3.7:1) 대비 모자라 ink2·흰 100%(앱 WordToggle 과 같게) */
.cchip.in .c { color: var(--on-brand); }
.cchip .ico { width: 16px; height: 16px; }
.cchip .vn { font-weight: 400; } /* 모델·변형 칩 건수(R12 G-1): 굵기만 낮추고 색은 칩 글 그대로(Ink3·흰 75% 안 씀 — 대비) */
.info { margin: 0 0 8px; color: var(--ink3); font-size: var(--fs-label); font-weight: 600; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.info.brand { color: var(--brand-bright); }

.sumline { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin: 8px 0 8px; }
.sumline .n { color: var(--ink2); font-size: var(--fs-body-sm); font-weight: 500; }
.sumline .right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.webonly { padding: 1px 8px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink3); font-size: var(--fs-meta); font-weight: 400; }
.find { width: 150px; }
.idband { display: flex; align-items: center; gap: 12px; padding: 12px 16px; margin-bottom: 12px; border-radius: 12px; background: var(--brand-soft); cursor: pointer; }
.idband b { display: block; font-size: var(--fs-body); font-weight: 600; } .idband span { color: var(--ink2); font-size: var(--fs-label); }
.idband .go { margin-left: auto; color: var(--brand-bright); font-weight: 700; font-size: var(--fs-body-sm); white-space: nowrap; }
.conds { margin: 4px 0 8px; }
.hero { grid-template-columns: 64px minmax(0,1fr) auto; }
.hero .hclick { cursor: pointer; }
.rbar { position: relative; height: 6px; margin: 24px 0 8px; border-radius: 4px; background: var(--surface2); }
.rbar .tick::after { content: ""; position: absolute; left: 0; top: 16px; width: 1px; height: 10px; background: var(--line-strong); } /* v2: 시세 눈금 line-strong(3:1) */

.rbar .me { position: absolute; top: -1px; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); transform: translateX(-50%); }
.foot-hint { padding: 12px 4px 0; color: var(--ink3); font-size: var(--fs-label); margin: 0; }
/* 매물 줄 (끝에 ☆·아님·↗) */
.row { grid-template-columns: 64px minmax(0,1fr) 104px 100px 104px 128px 60px 136px; gap: 12px; }
.row:focus-visible { outline: 2px solid var(--brand-bright); outline-offset: -2px; }
.row .ra { display: flex; justify-content: flex-end; align-items: center; gap: 0; }

.folded { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; background: var(--surface); border-bottom: 1px solid var(--line); color: var(--ink2); font-size: var(--fs-body-sm); }

/* 시세 탭 */
.dist { display: grid; gap: 8px; margin-top: 12px; }
.drow { display: grid; grid-template-columns: 70px minmax(0,1fr); align-items: center; gap: 12px; height: 36px; }

.dtrack .md { position: absolute; top: 4px; bottom: 4px; width: 2px; background: var(--ink); }
.dtrack .pt { position: absolute; top: 14px; width: 8px; height: 8px; border-radius: 50%; opacity: .6; margin-left: -4px; } /* dot 8 */
.axis { display: flex; justify-content: space-between; margin: 4px 0 0 80px; color: var(--ink3); font-size: var(--fs-meta); }
.sum3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; margin-top: 12px; }
.sum3 .big { margin: 0; font-size: var(--fs-display); line-height: 32px; font-weight: 700; font-variant-numeric: tabular-nums; }
.hint { margin: 8px 0 0; color: var(--ink3); font-size: var(--fs-label); line-height: 1.45; white-space: pre-line; }
/* 창 */

.scrim.clear { background: rgba(0,0,0,.35); }
.dialog { width: 100%; max-width: 560px; max-height: calc(100vh - 80px); display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r-dialog); overflow: hidden; }

.field:focus { outline: none; border-color: var(--brand-bright); }
.field.conflict { border-color: var(--coral); }
.frow { display: flex; align-items: center; gap: 8px; } .frow .field { flex: 1; }
.conf-note { margin: 4px 0 0; color: var(--coral); font-size: var(--fs-label); }
.swrow { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
.swrow .t { flex: 1; } .swrow b { display: block; font-size: var(--fs-body-sm); font-weight: 600; } .swrow span { color: var(--ink3); font-size: var(--fs-label); }
.sw { position: relative; width: 36px; height: 20px; border-radius: 999px; background: var(--surface2); border: 0; box-shadow: inset 0 0 0 1px var(--line-strong); cursor: pointer; flex: none; }

.sw[aria-checked="true"] { background: var(--brand); box-shadow: none; } .sw[aria-checked="true"]::after { left: 19px; background: var(--on-brand); }
.sw[disabled] { cursor: not-allowed; opacity: .6; }
.qcards { display: flex; flex-wrap: wrap; gap: 8px; }
.qcard { padding: 12px 16px; border-radius: 12px; background: var(--brand-soft); border: 1px solid rgba(169,139,247,.5); text-align: left; cursor: pointer; }
.qcard b { display: block; font-size: var(--fs-body); } .qcard span { color: var(--ink3); font-size: var(--fs-label); }
.qcard[disabled] { background: var(--surface2); border-color: var(--line); cursor: not-allowed; } .qcard[disabled] b { color: var(--ink3); }
/* 지켜보는 카드(0.7.2 R5): 꺼진 것처럼 보이지 않게 — 진한 글·민트 점(감시 중), 누르면 '그만 지켜보기'. 꿀골드 금지 */
.qcard.on { background: var(--surface2); border-color: var(--ink3); } .qcard.on > span { color: var(--ink2); }
.qcard.on .dot { display: inline-block; width: 8px; height: 8px; margin-right: 4px; vertical-align: middle; }
.suggest { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 12px 12px; border-radius: 12px; background: var(--surface2); cursor: pointer; border: 0; width: 100%; text-align: left; }
.suggest .mark { color: var(--brand-bright); font-weight: 700; } .suggest[aria-pressed="false"] .mark { color: var(--ink3); }
.suggest b { display: block; font-size: var(--fs-body-sm); } .suggest span span { color: var(--ink3); font-size: var(--fs-label); }
.band { display: flex; align-items: center; gap: 8px; width: 100%; margin-bottom: 8px; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); text-align: left; cursor: pointer; }
.band b { display: block; font-size: var(--fs-body); } .band span span { color: var(--ink3); font-size: var(--fs-label); }
.band .pick { margin-left: auto; color: var(--brand-bright); font-size: var(--fs-label); font-weight: 700; }
/* 물건 정하기 '모델' 칸(R12 디자인 4-8): 모델 줄 = 가격대 줄 꼴(고르는 줄 아님 — 고름 색 안 씀), 둘째 줄 Ink2(6-3 대비) */
.mrows { display: grid; gap: 8px; }
.mrow { position: relative; display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); }
.mrow .mt { flex: 1; min-width: 0; padding: 8px 0; } .mrow .mt b { display: block; font-size: var(--fs-body); color: var(--ink); } .mrow .mt span { display: block; color: var(--ink2); font-size: var(--fs-label); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mrow .mbase { color: var(--ink2); font-size: var(--fs-label); }
.mrow .mt span.mh { white-space: normal; margin-top: 2px; } /* R-1 후속: 값이 섞인 모델 까닭(앱 ModelRow Ink2) */
.mrow .iconbtn { width: 48px; height: 48px; }
.mmenu { position: absolute; right: 4px; top: calc(100% - 4px); z-index: 3; width: 240px; padding: 4px; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; }
.mmenu button { display: block; width: 100%; min-height: 48px; padding: 0 12px; border: 0; border-radius: 8px; background: none; color: var(--ink); text-align: left; cursor: pointer; font-size: var(--fs-body-sm); }
.mmenu button:hover, .mmenu button:focus-visible { background: var(--surface); }
.madd { min-height: 48px; font-size: var(--fs-label); }
.cchip.dim { opacity: .55; }
/* 시세 탭 판정 기준 모델 이름 칸(R12 G-10): 가장 좁게 78px · 넓게 112px, 두 줄까지 줄바꿈 */
.vcut { grid-template-columns: minmax(78px, max-content) minmax(0,1fr); }
.vcut b { max-width: 112px; white-space: normal; overflow: visible; text-overflow: clip; overflow-wrap: anywhere; }
.band[aria-checked="true"] { background: var(--brand-soft); border-color: var(--brand-bright); }
.preview { margin-top: 16px; padding: 12px 16px; border-radius: 12px; background: var(--surface2); }
.preview .l { color: var(--ink2); font-size: var(--fs-label); font-weight: 600; }
.vbtns { display: grid; gap: 2px; margin-top: 12px; } .vbtns .btn-text { justify-content: flex-start; height: 40px; }
.menu-scrim { position: fixed; inset: 0; z-index: 55; }
.menu { position: fixed; z-index: 56; width: 240px; padding: 4px; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; }
.menu button { display: block; width: 100%; height: 48px; padding: 0 12px; border: 0; border-radius: 8px; background: none; color: var(--ink); text-align: left; cursor: pointer; font-size: var(--fs-body-sm); }
.menu button:hover, .menu button:focus-visible { background: var(--surface); }
.menu button.coral { color: var(--coral); }
.menu button[disabled] { color: var(--ink3); cursor: not-allowed; }
.drawer { position: fixed; z-index: 61; top: 0; right: 0; bottom: 0; width: 480px; max-width: 100%; display: flex; flex-direction: column; background: var(--surface); border-left: 1px solid var(--line); }
.drawer.sm { width: 400px; background: var(--bg); }
.drawer .dbody { flex: 1; }
/* 0.8.2 판단 창 사유 목록(앱 ListingSheet: REASON 13/600 ink2 · 꼬리 body-sm ink3 · 줄 사이 2) */
.rlist { display: grid; gap: 2px; margin: 4px 0 0; padding: 0; list-style: none; }
.rlist .rt1 { display: block; color: var(--ink2); font-size: var(--fs-body-sm); font-weight: 600; }
.rlist .rsub, .rwlist .rsub { display: block; color: var(--ink3); font-size: var(--fs-body-sm); font-weight: 400; line-height: 19px; }
/* 0.8.2 사유 창(앱 ReasonDialog, 디자인 덧붙임 3-2): 판단 창 위에도 떠요 */
.wscrim { position: fixed; inset: 0; z-index: 65; display: grid; place-items: center; padding: 40px 16px; background: var(--scrim); }
.whydlg { width: 100%; max-width: 400px; max-height: calc(100vh - 80px); display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r-dialog); overflow: hidden; }
.whydlg .wbody { padding: 24px 24px 0; overflow-y: auto; }
.whydlg h2 { margin: 0; color: var(--ink); font-size: var(--fs-title); font-weight: 700; line-height: 24px; }
.whydlg .whead { margin: 8px 0 0; color: var(--ink2); font-size: var(--fs-body-sm); line-height: 19px; }
.whydlg .wreasons { margin-top: 16px; }
.whydlg .wgname { margin: 0 0 8px; color: var(--ink3); font-size: var(--fs-label); font-weight: 600; line-height: 16px; }
.rwlist { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
.rwlist .rt1 { display: block; color: var(--ink); font-size: var(--fs-body); font-weight: 500; line-height: 20px; }
.whydlg .wfoot { margin: 16px 0 0; color: var(--ink3); font-size: var(--fs-body-sm); line-height: 19px; }
.whydlg .wbtns { display: flex; justify-content: flex-end; padding: 8px 16px 8px; }
.whydlg .wbtns .btn-text { height: 48px; font-size: var(--fs-label); }
.sheet-head { display: grid; grid-template-columns: 72px 1fr; gap: 12px; }
.sheet-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
.sheet-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.facts-box { display: grid; gap: 4px; margin-top: 12px; padding: 12px 16px; border-radius: 12px; background: var(--surface2); color: var(--ink2); font-size: var(--fs-body-sm); }
.wchips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.cmdlist { margin: 0; padding: 0; list-style: none; }
.cmdlist li { display: grid; grid-template-columns: 20px minmax(0,1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.cmdlist .w { font-weight: 600; font-size: var(--fs-body-sm); } .cmdlist .s { color: var(--ink2); font-size: var(--fs-label); }
.cmdlist .s.bad b { color: var(--coral); } .cmdlist .s.run { color: var(--brand-bright); }
.cmdlist .cacts { margin: 4px 0 0 -8px; }
.toast { position: fixed; z-index: 70; left: 24px; bottom: 24px; display: flex; align-items: center; gap: 12px; max-width: 420px; padding: 12px 12px 12px 16px; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; font-size: var(--fs-body-sm); color: var(--ink); }
/* 설정 */
.settings { display: grid; gap: 12px; }
.sbox { min-width: 0; padding: 16px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); }
.sbox h3 { margin: 0; font-size: var(--fs-body); font-weight: 600; }
.sbox .d { margin: 4px 0 12px; color: var(--ink3); font-size: var(--fs-label); }
.sbox .bad { color: var(--coral); }
.phone { display: flex; align-items: center; gap: 12px; padding: 12px 12px; border-radius: 12px; background: var(--surface2); margin: 8px 0; }
.phone .ico { color: var(--ink2); }
.phone .t { flex: 1; } .phone b { display: block; font-size: var(--fs-body-sm); font-weight: 600; } .phone span { color: var(--ink2); font-size: var(--fs-label); }
.phone .tag { padding: 4px 12px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--ink3); color: var(--ink2); font-size: var(--fs-label); font-weight: 600; white-space: nowrap; }
.focusbox { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 8px 12px; border-radius: 12px; background: var(--brand-soft); }
.focusbox > .ico { color: var(--brand-bright); }
.fpick { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
/* 관심·알림함 */
.wlist { margin-top: 12px; border-top: 1px solid var(--line); }
.wrow { display: grid; grid-template-columns: 56px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); }
.wrow .tags { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 2px; color: var(--ink3); font-size: var(--fs-label); }
.wacts { display: flex; align-items: center; gap: 8px; }
.irow { cursor: pointer; }
.irow .it { display: flex; align-items: center; gap: 8px; font-weight: 500; color: var(--ink2); } /* v2 InboxRow: 읽음 ink2 · 안 읽음 ink */
.irow.unread .it { font-weight: 700; color: var(--ink); }
.irow .ud { width: 8px; height: 8px; border-radius: 50%; background: var(--brand-bright); flex: none; }

.perm { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 12px 0; padding: 12px 16px; border-radius: 12px; background: var(--surface2); font-size: var(--fs-body-sm); }
.perm dt { color: var(--ink3); } .perm dd { margin: 0; color: var(--ink); font-weight: 600; }
.center .field-l { display: block; margin: 12px 0 0; color: var(--ink2); font-size: var(--fs-body-sm); }
@media (max-width: 1080px) {
  .row { grid-template-columns: 64px minmax(0,1fr) 100px 100px 96px 116px 136px; }
  .row > .rn { display: none; }
}
@media (max-width: 900px) {
  .row { grid-template-columns: 64px minmax(0,1fr) auto; }
  .row > .rb, .row > .rp, .row > .rm, .row > .rw, .row > .rn { display: none; }
  .row .compact { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 4px; }
  .row .compact .rp2 { font-weight: 700; font-size: var(--fs-price-sm); font-variant-numeric: tabular-nums; }
  .sum3 { grid-template-columns: minmax(0,1fr); }
  .plist { display: none; }
}
@media (max-width: 760px) {

  .row > .ra { display: flex; }
  .steps { grid-template-columns: minmax(0,1fr); }
  .hero { grid-template-columns: 64px minmax(0,1fr); }
  .hero .hstar { grid-column: 1 / -1; }
  .scrim { padding: 0; place-items: stretch; }
  .dialog { max-width: none !important; max-height: none; border-radius: 0; }
  .dfoot { position: sticky; bottom: 0; background: var(--surface); }
  .drawer, .drawer.sm { width: 100%; }
  .iconbtn, .notbtn, .btn { min-height: 48px; } /* v2 touch-min 48 */
  button.bwhy::after { height: 48px; }
  .wscrim { padding: 16px; }
  /* 칩: 보이는 높이 36(chip-h), 누름 칸만 위아래로 늘려 48(Chip README) */
  .cchip, .mchip, .rchip .rq { position: relative; }
  .cchip::after, .mchip::after, .rchip .rq::after { content: ""; position: absolute; left: 0; right: 0; top: -6px; bottom: -6px; }
  .mchip::after { top: -7px; bottom: -7px; } /* 테두리 1px 바깥에서 재므로 */
  .iconbtn { width: 48px; }
  .rchip { height: 36px; }
  .rchip .x { opacity: 1; width: 32px; height: 32px; }
  .searchrow .btn { display: none; }
  .toast { left: 16px; right: 16px; bottom: 76px; max-width: none; }
  .menu { left: 16px !important; right: 16px; width: auto; }
  .live-text .live-long { display: none; }
  .cmdpill { max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }
  .quota { margin-left: 0; flex-basis: 100%; }
  .pv-head .acts { margin-left: 0; }
  /* 칩 줄(Chip README): 한 줄 + 가로로 밀기 — 두세 줄로 쌓여 목록을 밀어내지 않게. 스크롤바는 숨기고 누름 칸 48 은 그대로 */
  .chiprow { flex-wrap: nowrap; overflow-x: auto; padding-top: 6px; padding-bottom: 6px; margin-top: -6px; margin-bottom: 6px; /* 늘린 누름 칸이 스크롤 칸 안에 들게 */ overscroll-behavior-x: contain; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .chiprow::-webkit-scrollbar { display: none; }
  .chiprow > * { flex: none; }
  .page .chiprow { margin-left: -16px; margin-right: -16px; padding-left: 16px; padding-right: 16px; scroll-padding-inline: 16px; }
  .page .chiprow .chiprow, .chiprow .chiprow { margin: 0 !important; padding: 0; overflow: visible; }
  /* 관심 매물 줄(좁은 폭): 가격·단추를 글 아래 줄로 — 글 칸이 한 글자 폭으로 눌리던 것(0.8.0 전부터) 고침 */
  .wrow { grid-template-columns: 56px minmax(0,1fr); align-items: start; }
  .wrow .wacts { grid-column: 2; flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
