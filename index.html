<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<!-- 콘텐츠 보안 정책(약관·리스크 L-2): 스크립트는 이 사이트 파일만(페이지 안 스크립트 없음), 연결은 이 사이트 + api.github.com 만 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src https: data:; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>꿀매 레이더</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Cpath d='M14 6.72C15.47 9.03 18.2 12.67 18.2 16.24c0 4.7-8.4 4.7-8.4 0 0-3.57 2.73-7.21 4.2-9.52Z' fill='%23FFC24B'/%3E%3Ccircle cx='14' cy='14' r='12.6' fill='none' stroke='%23A98BF7' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 웹 2판 — 디자인 시안 web2-mock.html 의 토큰·모양 그대로(앱 ui/theme/Color.kt 와 같은 값). 시안 조작판만 뺐어요 */
/* ===== 토큰 — 앱 ui/theme/Color.kt 와 같은 값 ===== */
:root {
  --bg: #0D0E13; --surface: #16171E; --surface2: #1C1E27; --line: #23252F;
  --ink: #F2F3F6; --ink2: #A6ACBA; --ink3: #7B8290;
  --brand: #7A4BEA; --brand-bright: #A98BF7; --brand-soft: #241F3A;
  --honey: #FFC24B; --honey-soft: rgba(255,194,75,.14); --on-honey: #3A2800;
  --mint: #2BD4A0;
  --coral: #F2766A; --coral-soft: rgba(242,118,106,.15);
  --fair-fg: #9AA1AD; --fair-soft: rgba(150,154,168,.14);
  --mk-j: #22B07D; --mk-d: #F5812F; --mk-b: #4D8DF0;
  --font: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  /* 간격 4 단위 */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px;
  /* 모서리 */
  --r-badge: 6px; --r-ctl: 8px; --r-field: 10px; --r-thumb: 11px; --r-box: 12px; --r-search: 13px; --r-card: 16px; --r-dialog: 20px; --r-pill: 999px;
  --mk-j-soft: rgba(34,176,125,.16); --mk-d-soft: rgba(245,129,47,.16); --mk-b-soft: rgba(77,141,240,.16);
  --scrim: rgba(0,0,0,.6);
  color-scheme: dark;
}
html { font-size: 100%; }
html.big { font-size: 125%; }
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: .875rem; line-height: 1.5;
  word-break: keep-all; overflow-wrap: anywhere;
}
button, input, select { font: inherit; color: inherit; }
a { color: var(--brand-bright); }
:focus-visible { outline: 2px solid var(--brand-bright); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.ico { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
.ico.fill { fill: currentColor; stroke: none; }

/* ===== 머리 ===== */
.top {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 24px;
  height: 56px; padding: 0 24px; background: var(--bg); border-bottom: 1px solid var(--line);
}
.brand { display: inline-flex; align-items: center; gap: 10px; font-size: 1.125rem; font-weight: 700; color: var(--ink); text-decoration: none; flex: none; }
.tabs { display: flex; gap: 4px; height: 100%; }
.tab {
  display: inline-flex; align-items: center; gap: 6px; height: 100%; padding: 0 12px;
  border: 0; border-bottom: 2px solid transparent; background: none; color: var(--ink2);
  font-size: .875rem; font-weight: 600; cursor: pointer;
}
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--brand-bright); }
.tab .ico { display: none; }
.live { margin-left: auto; display: flex; align-items: center; gap: 12px; min-width: 0; }
.live-text { display: inline-flex; align-items: center; gap: 8px; color: var(--ink2); font-size: .8125rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--mint); }
.dot.gray { background: var(--ink3); }
.dot.coral { background: var(--coral); }
.live-short { display: none; }

/* 단추 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px;
  border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--surface); color: var(--ink);
  font-size: .8125rem; font-weight: 600; white-space: nowrap; cursor: pointer; text-decoration: none;
}
.btn:hover { background: var(--surface2); }
.btn-fill { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn-fill:hover { background: #6a3fd6; }
.btn-text { border-color: transparent; background: none; color: var(--brand-bright); padding: 0 8px; }
.btn-text:hover { background: var(--brand-soft); }
.btn-sm { height: 32px; padding: 0 10px; font-size: .75rem; }

/* ===== 띠 ===== */
.banners { display: grid; gap: 8px; max-width: 1280px; margin: 0 auto; padding: 12px 24px 0; }
.banners:empty { display: none; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: var(--r-box); background: var(--coral-soft); }
.banner .ico { color: var(--coral); margin-top: 2px; }
.banner b { display: block; color: var(--coral); font-weight: 700; font-size: .875rem; }
.banner span { display: block; color: var(--ink2); font-size: .8125rem; margin-top: 2px; }
.banner .btn { margin-left: auto; flex: none; }

/* ===== 본문 ===== */
.page { max-width: 1280px; margin: 0 auto; padding: 20px 24px 64px; }
.sec-title { margin: 0; font-size: 1.125rem; font-weight: 700; }
.sec-sub { margin: 3px 0 0; color: var(--ink3); font-size: .8125rem; }
.muted { color: var(--ink3); }
.ink2 { color: var(--ink2); }
.meta { color: var(--ink3); font-size: .8125rem; }

/* 첫 화면 */
.home { display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 24px; align-items: start; }
.home-head { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 12px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
.card {
  display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 10px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card);
}
.card.has-honey { border-color: rgba(255,194,75,.45); }
.card-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.card-head .when { margin-left: auto; color: var(--ink3); font-size: .75rem; }
.chip-name { padding: 2px 9px; border-radius: var(--r-pill); background: var(--brand-soft); color: var(--brand-bright); font-size: .75rem; font-weight: 700; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: var(--r-pill); background: var(--surface2); color: var(--ink2); font-size: .75rem; font-weight: 600; white-space: nowrap; }
.pill.honey { background: var(--honey-soft); color: var(--honey); }
.pill.focus { background: var(--brand-soft); color: var(--brand-bright); }
.pill .ico { width: 13px; height: 13px; vertical-align: -2px; }
.low { display: grid; grid-template-columns: 56px minmax(0,1fr); gap: 12px; align-items: center; padding: 4px 0; border-radius: var(--r-box); text-decoration: none; color: inherit; cursor: pointer; }
.low:hover .ltitle { text-decoration: underline; text-underline-offset: 3px; }
.ltitle { margin: 0; font-size: .9375rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.price-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-top: 2px; }
.price { font-size: 1.25rem; font-weight: 700; line-height: 1.25; font-variant-numeric: tabular-nums; }
.facts { margin: 0; color: var(--ink3); font-size: .8125rem; }
.lines { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.mlow { display: inline-flex; align-items: center; gap: 5px; color: var(--ink2); font-size: .8125rem; font-weight: 600; }
.note { display: flex; gap: 6px; align-items: flex-start; margin: 0; color: var(--ink2); font-size: .8125rem; }
.note .ico { margin-top: 1px; }
.note.link { cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; background: none; border: 0; padding: 0; text-align: left; }
.note.brand { color: var(--brand-bright); }
.card svg[role="img"] { display: block; width: 100%; height: 28px; }
.card-foot { display: flex; justify-content: flex-end; border-top: 1px solid var(--line); margin-top: 4px; padding-top: 4px; }
.state-text { margin: 6px 0 2px; font-size: .875rem; }

/* 사진 + 마켓 표시 */
.thumb { position: relative; width: 56px; height: 56px; border-radius: var(--r-thumb); background: var(--surface2); }
.thumb.lg { width: 96px; height: 96px; }
.thumb.sm { width: 48px; height: 48px; }
.thumb .mk { position: absolute; left: -5px; bottom: -5px; box-shadow: 0 0 0 2px var(--surface); }
.thumb::after { content: ""; position: absolute; inset: 30% 26%; border: 1.5px solid #2a2d38; border-radius: 4px; }
.mk {
  display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 5px; flex: none;
  color: var(--bg); font-size: .6875rem; font-weight: 700; line-height: 1;
}
.mk.sm { width: 15px; height: 15px; border-radius: 4px; font-size: .59375rem; }
.mk-j { background: var(--mk-j); } .mk-d { background: var(--mk-d); } .mk-b { background: var(--mk-b); }

/* 등급 배지 */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px; border-radius: var(--r-badge); font-size: .75rem; font-weight: 700; line-height: 1.3; white-space: nowrap; }
.badge .ico { width: 13px; height: 13px; vertical-align: -2px; }
.b-honey { background: var(--honey); color: var(--on-honey); }
.b-good { background: var(--brand-soft); color: var(--brand-bright); }
.b-fair { background: var(--fair-soft); color: var(--fair-fg); }
.b-high { background: var(--coral-soft); color: var(--coral); }
.b-caution { background: var(--surface2); color: var(--ink2); }
.b-plain { background: var(--surface2); color: var(--ink2); font-weight: 600; }
.then { color: var(--ink3); font-size: .75rem; }
.chg { padding: 3px 7px; border-radius: var(--r-badge); background: var(--surface2); color: var(--ink); font-size: .75rem; font-weight: 700; }
.chg.up { color: var(--ink3); }

/* 오래됨 */
.stale-day { --ink: #A6ACBA; --ink2: #7B8290; }
.stale-day .b-honey { background: transparent; color: var(--honey); box-shadow: inset 0 0 0 1.5px var(--honey); }
.sold-maybe { color: var(--ink3); font-size: .75rem; }

/* 새 꿀매 */
.feed { display: grid; gap: 8px; }
.feed-row { display: grid; grid-template-columns: 56px minmax(0,1fr); gap: 12px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); cursor: pointer; }
.feed-row.fresh { border-color: rgba(255,194,75,.5); }
.feed-row .top-line { display: flex; align-items: center; gap: 6px; }
.feed-row .top-line .meta { margin-left: auto; font-size: .75rem; }

/* 물건 화면 */
.pv { display: grid; grid-template-columns: 240px minmax(0,1fr); gap: 24px; align-items: start; }
.plist { position: sticky; top: 76px; display: grid; gap: 2px; }
.plist button {
  display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 2px 8px; align-items: center; width: 100%;
  padding: 10px 12px; border: 1px solid transparent; border-radius: var(--r-ctl); background: none; text-align: left; cursor: pointer;
}
.plist button:hover { background: var(--surface2); }
.plist button[aria-current="true"] { background: var(--surface); border-color: var(--line); }
.plist .pn { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plist .ps { color: var(--ink2); font-size: .75rem; font-variant-numeric: tabular-nums; }
.plist .ph { grid-column: 2; grid-row: 1 / span 2; }
.plist .pm { color: var(--ink3); font-size: .75rem; }
.pv-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.pv-head h1 { margin: 0; font-size: 1.375rem; font-weight: 700; line-height: 1.3; }
.conds { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; padding: 0; list-style: none; }
.conds li { padding: 2px 10px; border: 1px solid var(--line); border-radius: var(--r-pill); color: var(--ink2); font-size: .75rem; }
.app-only { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; color: var(--ink3); font-size: .8125rem; }
.grid2 { display: grid; grid-template-columns: minmax(0,1.25fr) minmax(0,1fr); gap: 16px; margin-top: 16px; }
.box { padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); min-width: 0; }
.box-label { margin: 0 0 8px; color: var(--brand-bright); font-size: .75rem; font-weight: 600; }
.box-label.plain { color: var(--ink2); }
.hero { display: grid; grid-template-columns: 96px minmax(0,1fr); gap: 16px; }
.hero .ltitle { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 1rem; }
.hero .price { font-size: 1.75rem; line-height: 1.2; }
.hero .badge { font-size: .8125rem; padding: 4px 9px; }
.hero-bottom { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.hero-bottom .btn { margin-left: auto; }
.vcut { display: grid; grid-template-columns: 78px minmax(0,1fr); gap: 8px; padding: 5px 0; font-size: .8125rem; }
.vcut b { font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vcut span { color: var(--ink2); }
.ref-big { margin: 0; font-size: .9375rem; font-weight: 700; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; margin-top: 12px; }
.grid3.two { grid-template-columns: repeat(2, minmax(0,1fr)); }
.trend { margin-top: 12px; }
.trend svg { display: block; width: 100%; height: 120px; }
.ledger { display: grid; gap: 4px; margin: 12px 2px 0; }

/* 매물 목록 */
.list-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 24px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-box); }
.mkt { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--r-pill); background: var(--surface); color: var(--ink); font-size: .8125rem; cursor: pointer; }
.mkt[aria-pressed="false"] { color: var(--ink3); }
.mkt[aria-pressed="false"] .mk { background: transparent !important; box-shadow: inset 0 0 0 1.5px currentColor; }
.mkt[aria-pressed="false"] .mk-j { color: var(--mk-j); } .mkt[aria-pressed="false"] .mk-d { color: var(--mk-d); } .mkt[aria-pressed="false"] .mk-b { color: var(--mk-b); }
.mkt b { font-weight: 600; font-variant-numeric: tabular-nums; }
/* 변형 칩 — 앱 ChoiceChip(Common.kt:231): 고르지 않음 Surface2·Ink2, 고름 Brand·흰 글 */
.vchips { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.vchip { height: 32px; padding: 0 13px; border: 0; border-radius: var(--r-pill); background: var(--surface2); color: var(--ink2); font: inherit; font-size: .8125rem; font-weight: 600; cursor: pointer; }
.vchip[aria-pressed="true"] { background: var(--brand); color: #fff; }
.sel { display: inline-flex; align-items: center; gap: 8px; color: var(--ink2); font-size: .8125rem; }
.sel select, .find { height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--bg); color: var(--ink); }
.find { width: 180px; }
.chk { display: inline-flex; align-items: center; gap: 7px; color: var(--ink2); font-size: .8125rem; cursor: pointer; }
.chk input { width: 16px; height: 16px; margin: 0; accent-color: var(--brand); }
.tools-right { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.list-sum { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin: 12px 2px 6px; color: var(--ink2); font-size: .8125rem; }
.list-sum .btn-text { height: 28px; }
.rows { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
.row {
  display: grid; grid-template-columns: 48px minmax(0,1fr) 116px 120px 104px 150px 76px 20px;
  gap: 12px; align-items: center; min-height: 64px; padding: 8px 4px; border-bottom: 1px solid var(--line);
  text-decoration: none; color: inherit; cursor: pointer;
}
.row:hover { background: var(--surface); }
.row.flash { box-shadow: inset 0 0 0 1.5px var(--brand-bright); }
.row .rt { margin: 0; font-size: .9375rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .rt .ico.fill { color: var(--ink); margin-right: 4px; }
.row .rs { margin: 2px 0 0; color: var(--ink3); font-size: .75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .rs.why { color: var(--ink2); white-space: normal; }
.row .rp { text-align: right; font-weight: 700; font-size: .9375rem; font-variant-numeric: tabular-nums; }
.row .rm { display: inline-flex; align-items: center; gap: 6px; color: var(--ink2); font-size: .8125rem; }
.row .rw, .row .rn { color: var(--ink2); font-size: .8125rem; }
.row .rw.unknown { color: var(--ink3); }
.row .rn { color: var(--ink3); }
.row .rx { color: var(--ink3); }
.row .compact { display: none; }
.empty { padding: 32px 8px; color: var(--ink3); text-align: center; }

/* 알림함 */
.inbox { max-width: 760px; display: grid; gap: 8px; }
.day { margin: 12px 4px 0; color: var(--ink2); font-size: .875rem; font-weight: 700; }
.irow { display: grid; grid-template-columns: 28px minmax(0,1fr); gap: 8px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.irow .ico { width: 20px; height: 20px; color: var(--ink2); margin-top: 1px; }
.irow.honey .ico { color: var(--honey); }
.irow .it { margin: 0; font-weight: 600; font-size: .875rem; }
.irow .ib { margin: 3px 0 0; color: var(--ink2); font-size: .8125rem; }
.irow .ig { margin: 4px 0 0; color: var(--ink3); font-size: .75rem; }

/* 수집 상태 */
.status { display: grid; gap: 16px; max-width: 1000px; }
.mkcards { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
.mkcard h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; font-size: .9375rem; }
.mkcard p { margin: 0; font-size: .8125rem; color: var(--ink2); }
.mkcard p.bad { color: var(--coral); }
.gap-row { display: grid; grid-template-columns: minmax(0,1fr) 220px; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: .8125rem; }
.gap-row .mark { border-bottom: 1px dashed var(--line); color: var(--ink3); }
.kv { display: flex; flex-wrap: wrap; gap: 4px 20px; margin: 0; padding: 0; list-style: none; color: var(--ink2); font-size: .8125rem; }
.kv b { color: var(--ink); font-weight: 600; }

/* 잠금·특수 */
.center { max-width: 460px; margin: 64px auto; padding: 28px 26px 24px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); }
.center h1 { margin: 0; font-size: 1.375rem; font-weight: 700; }
.center p { color: var(--ink2); }
.center input[type=password] { width: 100%; height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--bg); color: var(--ink); margin: 6px 0 12px; }
.center .row-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.err { color: var(--coral); font-size: .8125rem; margin: 0 0 8px; }
.skel { background: var(--surface2); border-radius: var(--r-ctl); }
.skel-card { height: 220px; border-radius: var(--r-card); }

.foot { margin-top: 32px; color: var(--ink3); font-size: .75rem; }

/* ===== 폭 ===== */
@media (max-width: 1080px) {
  .home { grid-template-columns: minmax(0,1fr); }

}

  .grid2 { grid-template-columns: minmax(0,1fr); }
  .grid3 { grid-template-columns: minmax(0,1fr); }

    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; height: 60px; gap: 0;
    background: var(--bg); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .tab[aria-current="page"] { border-top-color: var(--brand-bright); }

  .cards { grid-template-columns: minmax(0,1fr); }
  .row { grid-template-columns: 48px minmax(0,1fr); grid-template-areas: "th main"; align-items: start; }
  .row > .thumb { grid-area: th; }
  .row > .rmain { grid-area: main; }
  .row > .rb, .row > .rp, .row > .rm, .row > .rw, .row > .rn, .row > .rx { display: none; }

  .row .rt { white-space: normal; }

}
@media (max-width: 420px) {
  .hero .price { font-size: 1.5rem; }
}
@media (prefers-reduced-motion: reduce) { .row.flash { box-shadow: none; } }

/* ===== 웹 2판에서 더한 것 (시안 CSS 는 위에 그대로) ===== */
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
.thumb.has-img::after { display: none; }
a.row, a.low, a.feed-row { color: inherit; text-decoration: none; }
.chg.down { color: var(--ink); }
.since-down { color: var(--ink); font-weight: 700; }
.since-up { color: var(--ink3); }
.vcut.hold span { color: var(--ink3); }
.center .field { display: block; margin: 10px 0 0; color: var(--ink2); font-size: .8125rem; }
.center input[type=text] { width: 100%; height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--r-ctl); background: var(--bg); color: var(--ink); margin: 6px 0 4px; }
.center .tokbox { margin: 4px 0 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-box); }
.center .tokbox p { margin: 0; font-size: .8125rem; }
.center .tokbox input { margin-bottom: 0; }
.center .btn[disabled] { color: var(--ink3); cursor: default; }
.no-base { color: var(--ink3); font-size: .8125rem; }
.row .rx .sold-maybe { display: block; }

/* ===== 웹 조작 1판 (디자인 web-control-design.md 7장 · 시안 web-control-mock.html 그대로, 조작판만 뺌) ===== */
.tab .cnt { min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--brand); color: #fff; font-size: .6875rem; line-height: 18px; text-align: center; }
.cmdpill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 0; border-radius: 999px; background: var(--surface2); color: var(--ink2); font-size: .75rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
.cmdpill .ico { width: 13px; height: 13px; }
.cmdpill.run { background: var(--brand-soft); color: var(--brand-bright); }
.cmdpill.bad { background: var(--coral-soft); color: var(--coral); }
.btn-text.gray { color: var(--ink3); } .btn-text.gray:hover { background: var(--surface2); color: var(--ink2); }
.btn-text.coral { color: var(--coral); } .btn-text.coral:hover { background: var(--coral-soft); }
.btn[disabled], .btn[aria-disabled="true"] { color: var(--ink3); background: var(--surface); border-color: var(--line); cursor: not-allowed; }
.btn-text[disabled] { background: none; border-color: transparent; }
.btn-fill[disabled] { background: var(--surface2); border-color: var(--surface2); }
.btn-wide { width: 100%; height: 46px; font-size: .875rem; }
.iconbtn { display: inline-grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: var(--r-ctl); background: none; color: var(--ink3); cursor: pointer; flex: none; text-decoration: none; }
.iconbtn:hover { background: var(--surface2); color: var(--ink2); }
.iconbtn.on { color: var(--ink); }
.iconbtn.pending { color: var(--brand-bright); border: 1.5px dashed var(--brand-bright); border-radius: 50%; }
.iconbtn[disabled] { cursor: not-allowed; opacity: .6; }
.banner.brand { background: var(--brand-soft); } .banner.brand b, .banner.brand .ico { color: var(--brand-bright); }
.banner ul { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 2px; color: var(--ink2); font-size: .8125rem; }
.grow { flex: 1; }
.titlebar { display: flex; align-items: flex-end; gap: 8px; }
/* 검색창 + 최근 */
.searchrow { display: flex; gap: 8px; max-width: 760px; }
.search { flex: 1; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--r-search); background: var(--surface); }
.search:focus-within { border-color: var(--brand-bright); }

.search .ico { color: var(--ink3); width: 18px; height: 18px; }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; font-size: .9375rem; }

.searchrow .btn { height: 44px; }
.recent { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0 0; }

.rchip { display: inline-flex; align-items: center; gap: 0; height: 30px; padding: 0 4px 0 0; border-radius: 999px; background: var(--surface2); color: var(--ink2); font-size: .75rem; font-weight: 600; }
.rchip .rq { height: 100%; padding: 0 2px 0 12px; border: 0; background: none; color: inherit; font-weight: 600; cursor: pointer; border-radius: 999px 0 0 999px; }
.rchip.on { background: var(--brand); color: #fff; }
.rchip .x { display: inline-grid; place-items: center; width: 22px; height: 22px; border: 0; border-radius: 50%; background: none; color: var(--ink3); cursor: pointer; opacity: 0; }

.rchip.on .x { color: rgba(255,255,255,.75); }
.quota { margin-left: auto; color: var(--ink3); font-size: .75rem; }
.quota.full { color: var(--ink2); }
.under { margin: 6px 2px 0; color: var(--ink3); font-size: .75rem; }
.under.bad { color: var(--coral); }
.home { margin-top: 20px; }
.home-head { flex-wrap: wrap; gap: 8px; }
.empty-home { padding: 28px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); display: grid; gap: 10px; justify-items: start; }
.card { min-width: 0; }
.card.ghost { border: 1.5px dashed var(--ink3); background: transparent; }
.card.ghost .chip-name { background: var(--surface2); color: var(--ink2); }
.card.paused { background: transparent; }
.card.paused .chip-name { background: var(--surface2); color: var(--ink2); }
.pill.brand { background: var(--brand-soft); color: var(--brand-bright); }
.pill.line { background: none; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink3); }
button.pill { cursor: pointer; border: 0; }
.card-foot { justify-content: space-between; align-items: center; }
.low:focus-visible, .feed-row:focus-visible { outline: 2px solid var(--brand-bright); }
.feed-row { border-color: var(--line); }
/* 명령 처리 상태: 그 자리 한 줄 */
.cmd { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-height: 32px; color: var(--ink2); font-size: .8125rem; }
.cmd .ico { flex: none; }
.cmd .ago { color: var(--ink3); }
.cmd .acts { margin-left: auto; display: inline-flex; gap: 2px; }
.cmd .acts .btn { height: 28px; }
.cmd.run { color: var(--brand-bright); font-weight: 600; }
.cmd.bad b { color: var(--coral); font-weight: 700; }
.cmd.boxed { padding: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-box); margin-bottom: 12px; }
.cmd .ios { color: var(--ink3); }
.chg-pill { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-bright); font-size: .75rem; font-weight: 600; white-space: nowrap; text-decoration: none; }
/* 그냥 검색 진행 칸 */
.steps { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); }
.step { display: flex; align-items: center; gap: 8px; color: var(--ink3); font-size: .8125rem; }
.step .n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid currentColor; font-size: .6875rem; font-weight: 700; flex: none; }
.step .n .ico { width: 13px; height: 13px; }
.step.done { color: var(--ink2); }
.step.now { color: var(--brand-bright); font-weight: 700; }
.steps-foot { grid-column: 1 / -1; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 4px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--ink3); font-size: .75rem; }
.steps-foot .btn { margin-left: auto; }
.skels { display: grid; gap: 8px; margin-top: 12px; }
/* 결과 화면 */
.pv.solo { grid-template-columns: minmax(0,1fr); }
.pv-head .acts { margin-left: auto; display: flex; gap: 6px; }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--ink2); background: none; border: 0; cursor: pointer; padding: 0 4px; font-size: .8125rem; }
.subtabs { display: flex; gap: 4px; margin: 14px 0 12px; border-bottom: 1px solid var(--line); }
.subtabs button { height: 36px; padding: 0 14px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--ink2); font-weight: 600; cursor: pointer; }
.subtabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brand-bright); }
.chiprow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
.chiprow .gap { width: 6px; }
.mchip { display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 12px 0 7px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink2); font-size: .75rem; font-weight: 600; cursor: pointer; }
.mchip.all { padding: 0 14px; }
.mchip.all[aria-checked="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
.mchip.j[aria-checked="true"] { background: var(--mk-j-soft); border-color: var(--mk-j); color: var(--ink); }
.mchip.d[aria-checked="true"] { background: var(--mk-d-soft); border-color: var(--mk-d); color: var(--ink); }
.mchip.b[aria-checked="true"] { background: var(--mk-b-soft); border-color: var(--mk-b); color: var(--ink); }
.cchip { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 13px; border: 0; border-radius: 999px; background: var(--surface2); color: var(--ink2); font-size: .75rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
.cchip[aria-checked="true"], .cchip[aria-pressed="true"] { background: var(--brand); color: #fff; }
.cchip[disabled] { cursor: not-allowed; opacity: .55; }
.cchip.ex { background: var(--coral-soft); color: var(--coral); text-decoration: line-through; }
.cchip.in { background: var(--brand); color: #fff; }
.cchip .c { color: var(--ink2); font-weight: 400; } /* 건수: 디자인 확정 10/25(text-r12-r8 3-2) — Ink3(4.46:1)·흰 75%(3.7:1) 대비 모자라 ink2·흰 100%(앱 WordToggle 과 같게) */
.cchip.in .c { color: #fff; }
.cchip .ico { width: 14px; height: 14px; }
.cchip .vn { font-weight: 400; } /* 모델·변형 칩 건수(R12 G-1): 굵기만 낮추고 색은 칩 글 그대로(Ink3·흰 75% 안 씀 — 대비) */
.info { margin: 0 0 6px; color: var(--ink3); font-size: .75rem; font-weight: 600; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.info.brand { color: var(--brand-bright); }
.info.link { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.info .btn-text { height: 26px; font-size: .75rem; }
.sumline { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin: 6px 0 8px; }
.sumline .n { color: var(--ink2); font-size: .8125rem; font-weight: 500; }
.sumline .right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.webonly { padding: 1px 7px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--line); color: var(--ink3); font-size: .6875rem; font-weight: 400; }
.find { width: 150px; }
.idband { display: flex; align-items: center; gap: 12px; padding: 11px 14px; margin-bottom: 10px; border-radius: 14px; background: var(--brand-soft); cursor: pointer; }
.idband b { display: block; font-size: .875rem; font-weight: 600; } .idband span { color: var(--ink2); font-size: .75rem; }
.idband .go { margin-left: auto; color: var(--brand-bright); font-weight: 700; font-size: .8125rem; white-space: nowrap; }
.conds { margin: 4px 0 8px; }
.hero { grid-template-columns: 96px minmax(0,1fr) auto; }
.hero .hclick { cursor: pointer; }
.rbar { position: relative; height: 6px; margin: 26px 0 8px; border-radius: 3px; background: var(--surface2); }
.rbar .tick { position: absolute; top: -18px; color: var(--ink3); font-size: .6875rem; white-space: nowrap; }
.rbar .tick:nth-child(2) { transform: translateX(-50%); }
.rbar .me { position: absolute; top: -1px; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); transform: translateX(-50%); }
.foot-hint { padding: 14px 4px 0; color: var(--ink3); font-size: .75rem; margin: 0; }
/* 매물 줄 (끝에 ☆·아님·↗) */
.row { grid-template-columns: 48px minmax(0,1fr) 104px 100px 104px 128px 60px 136px; gap: 10px; }
.row:focus-visible { outline: 2px solid var(--brand-bright); outline-offset: -2px; }
.row .ra { display: flex; justify-content: flex-end; align-items: center; gap: 0; }
.notbtn { white-space: nowrap; display: inline-flex; align-items: center; gap: 3px; height: 32px; padding: 0 6px; border: 0; border-radius: var(--r-ctl); background: none; color: var(--ink3); font-size: .75rem; cursor: pointer; }
.notbtn:hover { background: var(--surface2); color: var(--ink2); }
.notbtn[disabled] { cursor: not-allowed; opacity: .6; }
.folded { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; background: var(--surface); border-bottom: 1px solid var(--line); color: var(--ink2); font-size: .8125rem; }
.folded .btn-text { margin-left: auto; height: 28px; }
/* 시세 탭 */
.dist { display: grid; gap: 6px; margin-top: 10px; }
.drow { display: grid; grid-template-columns: 70px minmax(0,1fr); align-items: center; gap: 10px; height: 36px; }
.drow .lab { display: inline-flex; gap: 6px; align-items: center; color: var(--ink2); font-size: .75rem; }
.dtrack { position: relative; height: 100%; }
.dtrack .q { position: absolute; top: 8px; bottom: 8px; background: var(--surface2); border-radius: 4px; }
.dtrack .md { position: absolute; top: 4px; bottom: 4px; width: 2px; background: var(--ink); }
.dtrack .pt { position: absolute; top: 15px; width: 6px; height: 6px; border-radius: 50%; opacity: .6; margin-left: -3px; }
.axis { display: flex; justify-content: space-between; margin: 4px 0 0 80px; color: var(--ink3); font-size: .6875rem; }
.sum3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; margin-top: 12px; }
.sum3 .big { margin: 0; font-size: 1.375rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.hint { margin: 6px 0 0; color: var(--ink3); font-size: .75rem; line-height: 1.45; white-space: pre-line; }
/* 창 */
.scrim { position: fixed; inset: 0; z-index: 60; background: var(--scrim); display: grid; place-items: center; padding: 40px 16px; }
.scrim.clear { background: rgba(0,0,0,.35); }
.dialog { width: 100%; max-width: 560px; max-height: calc(100vh - 80px); display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r-dialog); overflow: hidden; }
.dialog.lg { max-width: 640px; } .dialog.sm { max-width: 440px; }
.dhead { padding: 20px 20px 4px; display: flex; gap: 8px; align-items: flex-start; }
.dhead h2 { margin: 0; font-size: 1.125rem; font-weight: 700; flex: 1; }
.dhead h2 .ico { width: 18px; height: 18px; }
.dbody { padding: 4px 20px 16px; overflow-y: auto; }
.dfoot { display: flex; align-items: center; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); }
.desc { margin: 4px 0 0; color: var(--ink3); font-size: .75rem; line-height: 1.45; }
.flabel { display: flex; align-items: center; gap: 6px; margin: 16px 0 6px; font-size: .8125rem; font-weight: 600; }
.flabel .chgdot, .swrow .chgdot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--brand-bright); margin-right: 6px; vertical-align: 2px; }
.field { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--r-field); background: var(--surface2); color: var(--ink); }
.field:focus { outline: none; border-color: var(--brand-bright); }
.field.conflict { border-color: var(--coral); }
.frow { display: flex; align-items: center; gap: 8px; } .frow .field { flex: 1; }
.conf-note { margin: 4px 0 0; color: var(--coral); font-size: .75rem; }
.swrow { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
.swrow .t { flex: 1; } .swrow b { display: block; font-size: .8125rem; font-weight: 600; } .swrow span { color: var(--ink3); font-size: .75rem; }
.sw { position: relative; width: 36px; height: 20px; border-radius: 999px; background: var(--surface2); border: 0; cursor: pointer; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--ink3); }
.sw[aria-checked="true"] { background: var(--brand); } .sw[aria-checked="true"]::after { left: 19px; background: #fff; }
.sw[disabled] { cursor: not-allowed; opacity: .6; }
.qcards { display: flex; flex-wrap: wrap; gap: 8px; }
.qcard { padding: 10px 14px; border-radius: 14px; background: var(--brand-soft); border: 1px solid rgba(169,139,247,.5); text-align: left; cursor: pointer; }
.qcard b { display: block; font-size: .875rem; } .qcard span { color: var(--ink3); font-size: .75rem; }
.qcard[disabled] { background: var(--surface2); border-color: var(--line); cursor: not-allowed; } .qcard[disabled] b { color: var(--ink3); }
/* 지켜보는 카드(0.7.2 R5): 꺼진 것처럼 보이지 않게 — 진한 글·민트 점(감시 중), 누르면 '그만 지켜보기'. 꿀골드 금지 */
.qcard.on { background: var(--surface2); border-color: var(--ink3); } .qcard.on > span { color: var(--ink2); }
.qcard.on .dot { display: inline-block; width: 6px; height: 6px; margin-right: 5px; vertical-align: middle; }
.suggest { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: var(--surface2); cursor: pointer; border: 0; width: 100%; text-align: left; }
.suggest .mark { color: var(--brand-bright); font-weight: 700; } .suggest[aria-pressed="false"] .mark { color: var(--ink3); }
.suggest b { display: block; font-size: .8125rem; } .suggest span span { color: var(--ink3); font-size: .75rem; }
.band { display: flex; align-items: center; gap: 8px; width: 100%; margin-bottom: 6px; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); text-align: left; cursor: pointer; }
.band b { display: block; font-size: .875rem; } .band span span { color: var(--ink3); font-size: .75rem; }
.band .pick { margin-left: auto; color: var(--brand-bright); font-size: .75rem; font-weight: 700; }
/* 물건 정하기 '모델' 칸(R12 디자인 4-8): 모델 줄 = 가격대 줄 꼴(고르는 줄 아님 — 고름 색 안 씀), 둘째 줄 Ink2(6-3 대비) */
.mrows { display: grid; gap: 6px; }
.mrow { position: relative; display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); }
.mrow .mt { flex: 1; min-width: 0; padding: 7px 0; } .mrow .mt b { display: block; font-size: .875rem; color: var(--ink); } .mrow .mt span { display: block; color: var(--ink2); font-size: .75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mrow .mbase { color: var(--ink2); font-size: .75rem; }
.mrow .mt span.mh { white-space: normal; margin-top: 2px; } /* R-1 후속: 값이 섞인 모델 까닭(앱 ModelRow Ink2) */
.mrow .iconbtn { width: 44px; height: 44px; }
.mmenu { position: absolute; right: 4px; top: calc(100% - 4px); z-index: 3; width: 240px; padding: 4px; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; }
.mmenu button { display: block; width: 100%; min-height: 40px; padding: 0 12px; border: 0; border-radius: 8px; background: none; color: var(--ink); text-align: left; cursor: pointer; font-size: .8125rem; }
.mmenu button:hover, .mmenu button:focus-visible { background: var(--surface); }
.madd { min-height: 48px; font-size: .78rem; }
.cchip.dim { opacity: .55; }
/* 시세 탭 판정 기준 모델 이름 칸(R12 G-10): 가장 좁게 78px · 넓게 112px, 두 줄까지 줄바꿈 */
.vcut { grid-template-columns: minmax(78px, max-content) minmax(0,1fr); }
.vcut b { max-width: 112px; white-space: normal; overflow: visible; text-overflow: clip; overflow-wrap: anywhere; }
.band[aria-checked="true"] { background: var(--brand-soft); border-color: var(--brand-bright); }
.preview { margin-top: 18px; padding: 12px 14px; border-radius: 14px; background: var(--surface2); }
.preview .l { color: var(--ink2); font-size: .75rem; font-weight: 600; }
.vbtns { display: grid; gap: 2px; margin-top: 14px; } .vbtns .btn-text { justify-content: flex-start; height: 40px; }
.menu-scrim { position: fixed; inset: 0; z-index: 55; }
.menu { position: fixed; z-index: 56; width: 240px; padding: 4px; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; }
.menu button { display: block; width: 100%; height: 40px; padding: 0 12px; border: 0; border-radius: 8px; background: none; color: var(--ink); text-align: left; cursor: pointer; font-size: .8125rem; }
.menu button:hover, .menu button:focus-visible { background: var(--surface); }
.menu button.coral { color: var(--coral); }
.menu button[disabled] { color: var(--ink3); cursor: not-allowed; }
.drawer { position: fixed; z-index: 61; top: 0; right: 0; bottom: 0; width: 480px; max-width: 100%; display: flex; flex-direction: column; background: var(--surface); border-left: 1px solid var(--line); }
.drawer.sm { width: 400px; background: var(--bg); }
.drawer .dbody { flex: 1; }
.sheet-head { display: grid; grid-template-columns: 96px 1fr; gap: 14px; }
.sheet-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
.sheet-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.facts-box { display: grid; gap: 4px; margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--surface2); color: var(--ink2); font-size: .8125rem; }
.wchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.cmdlist { margin: 0; padding: 0; list-style: none; }
.cmdlist li { display: grid; grid-template-columns: 20px minmax(0,1fr); gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.cmdlist .w { font-weight: 600; font-size: .8125rem; } .cmdlist .s { color: var(--ink2); font-size: .75rem; }
.cmdlist .s.bad b { color: var(--coral); } .cmdlist .s.run { color: var(--brand-bright); }
.cmdlist .cacts { margin: 4px 0 0 -8px; }
.toast { position: fixed; z-index: 70; left: 24px; bottom: 24px; display: flex; align-items: center; gap: 12px; max-width: 420px; padding: 10px 10px 10px 14px; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; font-size: .8125rem; color: var(--ink); }
/* 설정 */
.settings { display: grid; gap: 12px; }
.sbox { padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); }
.sbox h3 { margin: 0; font-size: .875rem; font-weight: 600; }
.sbox .d { margin: 3px 0 10px; color: var(--ink3); font-size: .75rem; }
.sbox .bad { color: var(--coral); }
.phone { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface2); margin: 8px 0; }
.phone .ico { color: var(--ink2); }
.phone .t { flex: 1; } .phone b { display: block; font-size: .8125rem; font-weight: 600; } .phone span { color: var(--ink2); font-size: .75rem; }
.phone .tag { padding: 3px 10px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--ink3); color: var(--ink2); font-size: .75rem; font-weight: 600; white-space: nowrap; }
.focusbox { display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 9px 12px; border-radius: 12px; background: var(--brand-soft); }
.focusbox > .ico { color: var(--brand-bright); }
.fpick { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
/* 관심·알림함 */
.wlist { margin-top: 12px; border-top: 1px solid var(--line); }
.wrow { display: grid; grid-template-columns: 48px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); }
.wrow .tags { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 2px; color: var(--ink3); font-size: .75rem; }
.wacts { display: flex; align-items: center; gap: 6px; }
.irow { cursor: pointer; }
.irow .it { display: flex; align-items: center; gap: 6px; font-weight: 500; }
.irow.unread .it { font-weight: 700; }
.irow .ud { width: 8px; height: 8px; border-radius: 50%; background: var(--brand-bright); flex: none; }
/* 잠금·첫 연결 */
.perm { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 10px 0; padding: 12px 14px; border-radius: 12px; background: var(--surface2); font-size: .8125rem; }
.perm dt { color: var(--ink3); } .perm dd { margin: 0; color: var(--ink); font-weight: 600; }
.center .field-l { display: block; margin: 10px 0 0; color: var(--ink2); font-size: .8125rem; }
@media (max-width: 1080px) {
  .row { grid-template-columns: 48px minmax(0,1fr) 100px 100px 96px 116px 136px; }
  .row > .rn { display: none; }
}
@media (max-width: 900px) {
  .row { grid-template-columns: 48px minmax(0,1fr) auto; }
  .row > .rb, .row > .rp, .row > .rm, .row > .rw, .row > .rn { display: none; }
  .row .compact { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 4px; }
  .row .compact .rp2 { font-weight: 700; font-size: 1rem; font-variant-numeric: tabular-nums; }
  .sum3 { grid-template-columns: minmax(0,1fr); }
  .plist { display: none; }
}
@media (max-width: 760px) {
  .row { grid-template-columns: 48px minmax(0,1fr) auto; grid-template-areas: none; }
  .row > .ra { display: flex; }
  .steps { grid-template-columns: minmax(0,1fr); }
  .hero { grid-template-columns: 72px minmax(0,1fr); }
  .hero .hstar { grid-column: 1 / -1; }
  .scrim { padding: 0; place-items: stretch; }
  .dialog { max-width: none !important; max-height: none; border-radius: 0; }
  .dfoot { position: sticky; bottom: 0; background: var(--surface); }
  .drawer, .drawer.sm { width: 100%; }
  .rchip .rq, .cchip, .mchip, .iconbtn, .notbtn { min-height: 44px; }
  .iconbtn { width: 44px; }
  .rchip { height: 44px; }
  .rchip .x { opacity: 1; width: 32px; height: 32px; }
  .searchrow .btn { display: none; }
  .toast { left: 16px; right: 16px; bottom: 76px; max-width: none; }
  .menu { left: 16px !important; right: 16px; width: auto; }
  .live-text .live-long { display: none; }
  .cmdpill { max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }
  .quota { margin-left: 0; flex-basis: 100%; }
  .pv-head .acts { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
